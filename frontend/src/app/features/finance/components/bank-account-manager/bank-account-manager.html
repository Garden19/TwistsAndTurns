<section class="bank-account-manager">

    <label for="account-name">
        Account name
    </label>

    <input
        id="account-name"
        type="text"
        name="accountName"
        [(ngModel)]="accountName"
    />

    <label for="bank-name">
        Bank
    </label>

    <input
        id="bank-name"
        type="text"
        name="bankName"
        [(ngModel)]="bankName"
    />
</section>
