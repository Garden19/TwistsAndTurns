<div class="bank-account-manager">
    <div class="bank-account-intro">
        <h4>Add a bank account</h4>

        <p>
            Add an account so income and outgoings can be assigned to it.
        </p>
    </div>

    <div class="bank-account-form">
        <div class="form-field">
            <label for="account-name">
                Account name
            </label>

            <input
                id="account-name"
                type="text"
                name="accountName"
                placeholder="Bills Account"
                [(ngModel)]="accountName"
            />
        </div>

        <div class="form-field">
            <label for="bank-name">
                Bank
            </label>

            <input
                id="bank-name"
                type="text"
                name="bankName"
                placeholder="Monzo"
                [(ngModel)]="bankName"
            />
        </div>

        <button
            type="button"
            class="add-account-button"
            (click)="addBankAccount()"
        >
            Add bank account
        </button>
    </div>
</div>
